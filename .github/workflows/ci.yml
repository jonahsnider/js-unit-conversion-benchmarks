name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  run-benchmarks:
    name: Run benchmarks

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3
        with:
          cache: true
      - name: Run benchmarks
        run: pnpm start
        env:
          NODE_ENV: production
      - name: Generate GitHub App token
        if: ${{ github.ref == 'refs/heads/main' }}
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Configure Git user
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: Homebrew/actions/git-user-config@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # main
        with:
          token: ${{ steps.app-token.outputs.token }}
          username: ${{ steps.app-token.outputs.app-slug }}[bot]
      - name: Commit benchmark results
        if: ${{ github.ref == 'refs/heads/main' }}
        id: commit-benchmark-results
        run: |
          git add readme.md
          if git diff --cached --quiet; then
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "docs: update benchmark results [skip ci]"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Push benchmark results
        if: ${{ steps.commit-benchmark-results.outputs.created == 'true' }}
        uses: Homebrew/actions/git-try-push@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # main
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: main

  check:
    name: Check

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup pnpm
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3
        with:
          cache: true
      - parallel:
          - name: Run tests
            run: pnpm test
            env:
              NODE_ENV: production
          - name: Typecheck
            run: pnpm run build
          - name: Check style with Prettier
            run: pnpm run style
